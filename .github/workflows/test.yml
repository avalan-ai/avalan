name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      ignore_venv_cache:
        description: 'Ignore cached venv when running tests.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}‑${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target.name }}, Python ${{ matrix.python }})
    env:
      IGNORE_VENV_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ignore_venv_cache == 'true' }}
      PYDS4_BACKEND: ${{ matrix.target.backend }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - name: linux-cuda
            os: ubuntu-latest
            backend: cuda
          - name: macos-metal
            os: macos-15
            backend: metal

    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pre-pull PATCH worker base image
        if: matrix.target.os == 'ubuntu-latest'
        run: docker pull python:3.11-slim-bookworm@sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91

      - name: Set up Python ${{ matrix.python }} + Poetry cache
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: poetry-v14-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-2.3.3

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
          poetry config installer.only-binary pyds4

      - name: Load cached venv
        id: cached-poetry-dependencies
        if: env.IGNORE_VENV_CACHE != 'true'
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-v14-${{ runner.os }}-${{ matrix.target.name }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            venv-v14-${{ runner.os }}-${{ matrix.target.name }}-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: poetry sync --all-extras --with test --no-interaction

      - name: Verify pyds4 backend
        run: |
          poetry run python - <<'PY'
          import os

          import pyds4

          expected = os.environ["PYDS4_BACKEND"]
          capabilities = pyds4.capabilities()
          actual = getattr(pyds4, "__ds4_native_backend__", None)
          if not actual:
              actual = getattr(capabilities, "backend", None)
          if hasattr(actual, "value"):
              actual = actual.value
          if str(actual).lower() != expected:
              raise SystemExit(
                  f"pyds4 backend {actual!r} does not match {expected!r}"
              )
          print(f"pyds4 backend: {actual}")
          PY

      - name: Install Linux MLX runtime
        if: matrix.target.os == 'ubuntu-latest'
        run: poetry run pip install "mlx[cpu]==0.31.2"

      - name: Install Linux MLX-LM runtime
        if: matrix.target.os == 'ubuntu-latest'
        run: poetry run pip install "mlx-lm[cpu]==0.31.3"

      - name: Install Bubblewrap runtime
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libacl1

      - name: Enable Bubblewrap user namespace isolation
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          bwrap --die-with-parent --unshare-user --uid 0 --gid 0 \
            --unshare-pid --unshare-ipc --unshare-uts --unshare-net \
            --new-session --ro-bind / / --proc /proc --dev /dev \
            -- /usr/bin/id --user | grep --fixed-strings --line-regexp 0

      - name: Verify structured-input type contracts
        if: matrix.target.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          make lint-check
          make typecheck-input-contract INPUT_PHASE=5
          poetry run python scripts/verify_patch_types.py \
            --through-phase 11 --include-planned

      - name: Start PostgreSQL
        if: matrix.target.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 \
            --command="ALTER USER postgres PASSWORD 'postgres';"
          pg_isready --host 127.0.0.1 --port 5432

      - name: Run tests with PostgreSQL
        if: matrix.target.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          AVALAN_TASK_TEST_POSTGRESQL_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make test no-install

      - name: Run non-Docker tests (macOS lacks Docker/Linux VM)
        if: matrix.target.os == 'macos-15'
        run: |
          # GitHub-hosted macos-15 has no Docker daemon or nested Linux VM.
          # Keep every portable test; deselect only real Docker integrations.
          poetry run pytest --verbose \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_reuses_shared_context_contract_corpus \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_subroot_commit_and_root_replacement_race \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_commits_container_move_with_private_artifact_cleanup \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_scopes_container_mutation_to_trusted_cwd \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_inactive_profile_never_starts_or_advertises_runtime \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_missing_container_endpoint_fails_closed \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_wrong_container_binder_reaps_runtime \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_requirements \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_recovers_authenticated_lease_across_process_restart \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_serializes_initial_volume_creation_across_processes \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_dispose_fails_closed_while_reclaim_owns_guard \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_failed_start_cleanup_never_deletes_reclaimed_volume \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_failed_start_cleanup_defers_to_live_volume \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_e2e_020_reconciles_cancelled_multifile_apply \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_e2e_021_fences_replaced_plan_bound_context \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_reconciles_post_dispatch_stale_after_first_effect \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_rejects_forged_replayed_and_out_of_order_channel \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_preserves_container_representation_and_metadata \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_rejects_hostile_container_volume_topology \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_container_public_lifecycle_and_surfaces_are_redacted \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_serializes_container_contexts_in_one_domain \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_rejects_mismatched_domain_for_one_persistent_volume \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_rejects_destination_race_at_container_fence \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_service_loss_at_fence_stays_pending_without_effect \
            --deselect=tests/patch/phase_11_contract_test.py::test_patch_phase_11_container_service_has_only_its_sealed_authority \
            --deselect=tests/patch/phase_14_tri_profile_test.py::test_patch_e2e_035_container_shared_root_is_test_only_and_physical \
            --deselect=tests/patch/phase_15_hardening_test.py::test_patch_e2e_039_local_sandbox_container_conformance

      - name: Run tests
        if: matrix.target.os == 'ubuntu-latest' && matrix.python != '3.11'
        run: make test no-install

      - name: Verify native sandbox mutation contract
        if: matrix.python == '3.11'
        run: poetry run pytest -q tests/patch/phase_10_contract_test.py

      - name: Verify clean generated metadata
        run: git diff --check

  wheel:
    name: wheel (${{ matrix.target.name }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        target:
          - name: linux-cuda
            os: ubuntu-latest
            backend: cuda
          - name: macos-metal
            os: macos-15
            backend: metal

    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }} + Poetry cache
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: poetry-v14-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-2.3.3

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1
        with:
          version: 2.3.3
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Build wheel
        run: poetry build --format wheel --clean

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: avalan-wheel-${{ matrix.target.name }}-${{ matrix.python }}
          path: dist/*.whl
