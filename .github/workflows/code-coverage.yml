name: Code Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  code-quality: write

jobs:
  pytest:
    name: Pytest Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Pre-pull PATCH worker base image
        run: docker pull python:3.11-slim-bookworm@sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Install Bubblewrap runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libacl1

      - name: Enable Bubblewrap user namespace isolation
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          bwrap --die-with-parent --unshare-user --uid 0 --gid 0 \
            --unshare-pid --unshare-ipc --unshare-uts --unshare-net \
            --new-session --ro-bind / / --proc /proc --dev /dev \
            -- /usr/bin/id --user | grep --fixed-strings --line-regexp 0

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set=ON_ERROR_STOP=1 \
            --command="ALTER USER postgres PASSWORD 'postgres';"
          pg_isready --host 127.0.0.1 --port 5432

      - name: Install project dependencies
        run: poetry sync --all-extras --with test

      - name: Verify native sandbox and type-contract smoke
        run: |
          poetry run pytest -q tests/patch/phase_10_contract_test.py \
            tests/project_metadata_test.py::test_test_workflow_covers_supported_matrix_and_build_gates
          make typecheck-input-contract INPUT_PHASE=12
          make typecheck-conversation-contract CONVERSATION_PHASE=11
          poetry run pytest -q \
            tests/interaction/rejected_result_type_contract_test.py \
            tests/interaction/rejected_store_trust_boundary_type_contract_test.py

      - name: Run coverage
        env:
          AVALAN_TASK_TEST_POSTGRESQL_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make test no-install coverage

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
