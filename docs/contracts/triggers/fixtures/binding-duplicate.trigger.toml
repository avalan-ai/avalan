[trigger]
schema_version = 1
name = "contract-trigger"

[task]
ref = "queued.task.toml"

[input]
value = { scheduled = "", occurrence = "", revision = 0 }

[[input.bindings]]
path = "/scheduled"
source = "scheduled_at"
[[input.bindings]]
path = "/scheduled"
source = "occurrence_id"

[schedule]
type = "cron"
expression = "0 9 * * MON-FRI"
timezone = "America/New_York"
